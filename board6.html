<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>代行なう板</title>
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="/manifest-board.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="代行なう板">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --bg:#0B1220; --surface:#142338; --surface-2:#1B2E48; --line:#22385A;
  --text:#E8EEF7; --muted:#8FA3BF; --amber:#FFB020; --green:#2ECC71; --red:#FF5A5A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-feature-settings:"palt"; padding-bottom:env(safe-area-inset-bottom);
}
.bar{
  position:sticky;top:0;z-index:10;background:rgba(11,18,32,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:9px;
}
.brand{font-size:15px;font-weight:800}
.brand span{color:var(--muted);font-weight:600;font-size:12px;display:block;margin-top:2px}
.bell{
  margin-left:auto;border:1px solid var(--line);border-radius:999px;
  background:var(--surface-2);font-size:17px;padding:10px 13px;cursor:pointer;font-family:inherit;
}
.bell.on{border-color:var(--amber);background:rgba(255,176,32,.14)}
.toggle{border:0;border-radius:999px;padding:11px 17px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer}
.toggle.on{background:var(--green);color:#06210F}
.toggle.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.meta{padding:9px 16px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.gps{margin-left:auto;font-size:11px;font-weight:800}
.gps.on{color:var(--green)} .gps.off{color:var(--muted)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.panel{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.pRow{display:flex;gap:8px;align-items:center}
.pTtl{font-size:13px;font-weight:800;flex:none}
.pTtl span{color:var(--green);font-size:12px;margin-left:8px;font-variant-numeric:tabular-nums}
.panel select,.panel input{
  background:var(--surface);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:11px;font-family:inherit;font-size:14px;font-weight:700;
}
.panel select{flex:none;width:80px}
.panel input{flex:1;min-width:0}
.pBtn{
  flex:none;border:0;border-radius:10px;background:var(--green);color:#06210F;
  font-family:inherit;font-size:13px;font-weight:800;padding:12px 14px;cursor:pointer;
}
.pBtn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.sec{padding:16px 12px 4px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.1em}
.list{padding:6px 12px 30px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;animation:in .25s ease-out}
.card.mine{border-color:var(--amber)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rail{width:6px;flex:none;background:var(--green);transition:background .4s}
.body{flex:1;min-width:0;padding:14px 15px 15px}
.age{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.age b{color:var(--text)}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.route{display:flex;flex-direction:column;gap:9px;margin-bottom:13px}
.pt{display:flex;gap:10px;align-items:flex-start}
.pin{flex:none;width:20px;text-align:center;font-size:12px;font-weight:800;padding-top:2px}
.pin.a{color:var(--amber)} .pin.b{color:var(--muted)}
.addr{font-size:16px;font-weight:700;line-height:1.4;word-break:break-word}
.stats{display:flex;align-items:baseline;gap:14px;padding-top:12px;border-top:1px solid var(--line);margin-bottom:13px}
.yen{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.yen small{font-size:14px;margin-left:1px}
.km{font-size:13px;color:var(--muted);font-weight:700}
.act{display:flex;flex-direction:column;gap:8px}
.act .r{display:flex;gap:8px}
button.b, a.b{
  flex:1;border:0;border-radius:12px;font-family:inherit;font-size:15px;font-weight:800;
  padding:15px;cursor:pointer;text-align:center;text-decoration:none;display:block;transition:.12s;
}
button.b:active,a.b:active{transform:scale(.98)}
.b.amber{background:var(--amber);color:#241400}
.b.green{background:var(--green);color:#06210F}
.b.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);font-size:14px;padding:13px}
button.b:disabled{background:var(--surface-2);color:var(--muted);transform:none}

.empty{padding:70px 30px;text-align:center}
.empty h2{font-size:17px;font-weight:700;margin:0 0 8px;color:var(--muted)}
.empty p{font-size:13px;color:var(--muted);opacity:.7;margin:0;line-height:1.7}
.scan{width:44px;height:44px;margin:0 auto 22px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--amber);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.paused .scan{animation:none;border-top-color:var(--line)}
.toast{
  position:fixed;left:12px;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:15px;
  font-size:14px;font-weight:700;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;
}
.toast.show{opacity:1;transform:none}
.toast.err{border-color:var(--red);color:var(--red)}
.toast.ok{border-color:var(--green);color:var(--green)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="brand">案件掲示板<span id="coName">代行なう運転代行</span></div>
  <button class="bell off" id="bell">🔕</button>
  <button class="toggle off" id="toggle">受付停止中</button>
</div>
<div class="meta">
  <div class="dot" id="dot"></div><span id="metaText">接続中…</span>
  <span class="gps off" id="gpsState">位置未送信</span>
</div>

<div class="panel">
  <div class="pRow">
    <div class="pTtl">空車アピール<span id="appealLeft"></span></div>
    <select id="cars">
      <option value="1">1台</option><option value="2">2台</option><option value="3">3台</option>
    </select>
    <button class="pBtn" id="appeal">15分アピール</button>
  </div>
  <div class="pRow">
    <input id="newsT" placeholder="お知らせの見出し（例：本日すぐ行けます）">
    <button class="pBtn ghost" id="newsBtn">投稿</button>
  </div>
  <div class="pRow">
    <a href="/kokyaku.html" style="flex:1;text-align:center;background:#16233A;border:1px solid #22314C;border-radius:11px;color:#EAF1FF;font-size:13.5px;font-weight:800;padding:12px;text-decoration:none">👥 顧客一覧を見る</a>
  </div>
</div>

<div id="gate" style="position:fixed;inset:0;z-index:9999;background:#0B1220;display:none;align-items:center;justify-content:center;padding:26px">
  <div style="width:100%;max-width:320px;text-align:center">
    <div style="font-size:18px;font-weight:900;margin-bottom:6px">案件掲示板</div>
    <div style="font-size:12.5px;color:#8A9BB8;font-weight:600;margin-bottom:20px">暗証番号を入力してください</div>
    <input id="pin" type="tel" inputmode="numeric" maxlength="8" placeholder="････" style="width:100%;background:#16233A;border:1px solid #22314C;border-radius:13px;color:#EAF1FF;font-size:22px;font-weight:800;letter-spacing:.5em;text-align:center;padding:16px;margin-bottom:11px">
    <button id="gbtn" style="width:100%;background:#FFB020;color:#241400;border:none;border-radius:13px;font-size:16px;font-weight:900;padding:16px">開く</button>
    <div id="gerr" style="color:#FF6B6B;font-size:12.5px;font-weight:700;margin-top:12px;min-height:18px"></div>
  </div>
</div>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
var PIN = "3179";  /* ← 暗証番号。変えたいときはこの数字を書き換えてください */

var SB = "https://kjfmcpwstubgezebmstt.supabase.co/rest/v1/";
var RPC = SB + "rpc/";
var SK = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZm1jcHdzdHViZ2V6ZWJtc3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODU3MTksImV4cCI6MjA5NDE2MTcxOX0.GF5QPVI4AUCfIqdmApplwOAEDBoESZTfadi-hbOb7Gs";
var COMPANY_ID = "daikounaw";
var H = {"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json","Prefer":"return=representation"};

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(m,t){ var e=$('toast'); e.textContent=m; e.className='toast show '+(t||'');
  clearTimeout(e._t); e._t=setTimeout(function(){e.className='toast';},3200); }
function minsAgo(iso){ return Math.max(0, Math.floor((Date.now()-new Date(iso).getTime())/60000)); }
function railColor(m){ return m<3?'var(--green)':(m<8?'var(--amber)':'var(--red)'); }

var openOrders=[], myOrders=[], isOpen=false, busy=null, knownIds=null;

/* ===== 通知音 ===== */
var soundOn=false, audioCtx=null, _bus=null;

function _buildBus(){
  if (_bus||!audioCtx) return;
  // ドライ＋残響 → コンプレッサー → 出力。歪ませずに音圧と広がりを両立
  _bus=audioCtx.createGain(); _bus.gain.value=0.9;
  var comp=audioCtx.createDynamicsCompressor();
  comp.threshold.value=-20; comp.knee.value=14; comp.ratio.value=6;
  comp.attack.value=0.004; comp.release.value=0.3;
  var rate=audioCtx.sampleRate, len=Math.floor(rate*2.6);
  var buf=audioCtx.createBuffer(2,len,rate);
  for (var ch=0; ch<2; ch++){
    var d=buf.getChannelData(ch);
    for (var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
  }
  var rev=audioCtx.createConvolver(); rev.buffer=buf;
  var wet=audioCtx.createGain(); wet.gain.value=0.42;
  _bus.connect(comp);
  _bus.connect(rev); rev.connect(wet); wet.connect(comp);
  comp.connect(audioCtx.destination);
}

// FM一音（打鍵の瞬間だけ倍音が煌めく。ローズ／鉄琴のような艶）
function _voice(f,at,dur,vol,ratio,idx){
  var car=audioCtx.createOscillator(), amp=audioCtx.createGain();
  var mod=audioCtx.createOscillator(), mg=audioCtx.createGain();
  car.type='sine'; car.frequency.value=f;
  mod.type='sine'; mod.frequency.value=f*ratio;
  mg.gain.setValueAtTime(f*idx,at);
  mg.gain.exponentialRampToValueAtTime(f*idx*0.02,at+dur*0.4);
  mod.connect(mg); mg.connect(car.frequency);
  amp.gain.setValueAtTime(0.0001,at);
  amp.gain.exponentialRampToValueAtTime(vol,at+0.018);
  amp.gain.exponentialRampToValueAtTime(vol*0.28,at+dur*0.32);
  amp.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  car.connect(amp); amp.connect(_bus);
  mod.start(at); mod.stop(at+dur+0.05);
  car.start(at); car.stop(at+dur+0.05);
}

// Cmaj9 のアルペジオ（ミ→ソ→シ→レ）。転がるように鳴らす
function beep(vol){
  if (!audioCtx) return;
  _buildBus();
  var v=(vol==null?1:vol/0.4); // 旧beepの音量指定に合わせる
  var s=audioCtx.currentTime+0.02;
  _voice(1318.51,s,      2.4,0.34*v,3.5,1.6); // E6
  _voice(1567.98,s+0.11, 2.4,0.32*v,3.5,1.5); // G6
  _voice(1975.53,s+0.22, 2.6,0.30*v,3.5,1.4); // B6
  _voice(2349.32,s+0.33, 3.0,0.28*v,2.0,1.1); // D7
  _voice(659.26, s+0.33, 3.2,0.16*v,2.0,0.7); // E5（下に厚みを足す）
}
$('bell').onclick=function(){
  soundOn=!soundOn;
  this.className='bell '+(soundOn?'on':'off');
  this.textContent=soundOn?'🔔':'🔕';
  if (soundOn){
    try{
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      if (audioCtx.state==='suspended') audioCtx.resume();
      _buildBus();
      if (_bus) _bus.gain.setValueAtTime(0.9,audioCtx.currentTime);
      beep(0.16); toast('新しい案件を音で知らせます','ok');
    }catch(e){ toast('この端末では音を出せません','err'); }
  }
};
/* 鳴り続ける受注アラート。停止ボタンか60秒で止まる */
var _alertTimer=null, _autoStopTimer=null;
function alertNew(n){
  document.title='🔔 新着'+n+'件｜案件掲示板';
  toast('新しい案件が'+n+'件入りました','ok');
  stopAlert();
  if (audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
  if (_bus&&audioCtx){ _bus.gain.cancelScheduledValues(audioCtx.currentTime); _bus.gain.setValueAtTime(0.9,audioCtx.currentTime); }
  var ring=function(){
    if (soundOn) beep(0.4);
    if (navigator.vibrate) navigator.vibrate([160,120,160,120,260]);
  };
  ring();
  _alertTimer=setInterval(ring,3400);
  _autoStopTimer=setTimeout(stopAlert,60000);
  var b=$('alertStopBtn'); if (b) b.style.display='block';
}
function stopAlert(){
  clearInterval(_alertTimer); _alertTimer=null;
  clearTimeout(_autoStopTimer); _autoStopTimer=null;
  try{
    if (_bus&&audioCtx){
      var t=audioCtx.currentTime;
      _bus.gain.cancelScheduledValues(t);
      _bus.gain.setValueAtTime(_bus.gain.value,t);
      _bus.gain.linearRampToValueAtTime(0.0001,t+0.18); // 残響ごと素早く消す
    }
  }catch(e){}
  try{ if (navigator.vibrate) navigator.vibrate(0); }catch(e){}
  document.title='案件掲示板｜代行なう';
  var b=$('alertStopBtn'); if (b) b.style.display='none';
}

/* ===== 位置送信 ===== */
var lastSent=0, gpsStarted=false;
function startGPS(){
  if (!navigator.geolocation || gpsStarted){ return; }
  gpsStarted=true;
  navigator.geolocation.watchPosition(function(p){
    $('gpsState').className='gps on';
    $('gpsState').textContent='位置送信中';
    var now=Date.now();
    if (now-lastSent < 12000) return;
    lastSent=now;
    fetch(SB+'companies?id=eq.'+COMPANY_ID,{method:'PATCH',headers:H,
      body:JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude,location_updated_at:new Date().toISOString()})
    }).catch(function(){});
  }, function(){
    $('gpsState').className='gps off';
    $('gpsState').textContent='位置を取得できません';
  }, {enableHighAccuracy:true, maximumAge:8000, timeout:15000});
}

/* ===== 描画 ===== */
function card(o, mine){
  var m=minsAgo(o.created_at);
  var price = o.price ? o.price.toLocaleString()+'<small>円</small>' : '<small>距離で計算</small>';
  var nav='https://www.google.com/maps/dir/?api=1&destination='+
    (o.pickup_lat? o.pickup_lat+','+o.pickup_lng : encodeURIComponent(o.pickup));
  var acts;
  if (!mine){
    acts='<button class="b amber" data-act="accept" data-id="'+o.id+'"'+(busy===o.id?' disabled':'')+'>'+
      (busy===o.id?'受注しています…':'この案件を受注する')+'</button>';
  } else {
    acts='<div class="r"><a class="b ghost" href="'+nav+'" target="_blank">地図で案内</a>'+
      '<a class="b ghost" href="tel:'+esc(o.cphone)+'">お客様に電話</a></div>'+
      (o.status==='accepted'
        ? '<button class="b amber" data-act="arriving" data-id="'+o.id+'">お客様に合流・運行開始</button>'
        : '<button class="b green" data-act="done" data-id="'+o.id+'">運行を完了する</button>');
  }
  return '<div class="card'+(mine?' mine':'')+'">'+
    '<div class="rail" style="background:'+(mine?'var(--amber)':railColor(m))+'"></div>'+
    '<div class="body">'+
      '<div class="age"><b>'+(mine?(o.status==='arriving'?'運行中':'お迎え中'):m+'分前')+'</b>'+
        (mine?'':'の依頼')+(o.km?'<span class="tag">'+o.km+'km</span>':'')+
        (mine?'<span class="tag">'+esc(o.cname||'お客様')+'</span>':'')+
        (!mine&&o.preferred_company_id===COMPANY_ID?'<span class="tag" style="color:var(--amber);border-color:rgba(255,176,32,.4)">指名</span>':'')+'</div>'+
      '<div class="route">'+
        '<div class="pt"><div class="pin a">出発</div><div class="addr">'+esc(o.pickup)+'</div></div>'+
        '<div class="pt"><div class="pin b">到着</div><div class="addr">'+esc(o.dropoff)+'</div></div>'+
      '</div>'+
      '<div class="stats"><div class="yen">'+price+'</div>'+
        '<div class="km">'+(mine?'':esc(o.cname||'お客様'))+'</div></div>'+
      '<div class="act">'+acts+'</div>'+
    '</div></div>';
}

function render(){
  var h='';
  if (myOrders.length){
    h += '<div class="sec">対応中</div><div class="list">'+
      myOrders.map(function(o){return card(o,true);}).join('')+'</div>';
  }
  h += '<div class="sec">募集中の案件</div>';
  if (!openOrders.length){
    h += '<div class="empty'+(isOpen?'':' paused')+'"><div class="scan"></div>'+
      '<h2>'+(isOpen?'注文を探しています':'受付を停止しています')+'</h2>'+
      '<p>'+(isOpen?'新しい案件が入ると自動で表示されます。':'受付を開始すると案件が届きます。')+'</p></div>';
  } else {
    h += '<div class="list">'+openOrders.map(function(o){return card(o,false);}).join('')+'</div>';
  }
  $('app').innerHTML=h;

  var bs=$('app').querySelectorAll('button[data-act]');
  for (var i=0;i<bs.length;i++){
    (function(b){ b.onclick=function(){ action(b.getAttribute('data-act'), b.getAttribute('data-id')); }; })(bs[i]);
  }
}

async function action(act, id){
  if (act==='accept'){
    stopAlert();
    if (busy) return;
    if (!confirm('この案件を受注します。よろしいですか？')) return;
    busy=id; render();
    try{
      var r=await fetch(RPC+'accept_order',{method:'POST',headers:H,
        body:JSON.stringify({p_order_id:id,p_company_id:COMPANY_ID})});
      busy=null;
      if (r.ok) toast('受注しました。お迎えに向かってください','ok');
      else { var t=await r.text(); toast(t.indexOf('他社')>=0?'他社が先に受注しました':'受注できませんでした','err'); }
    }catch(e){ busy=null; toast('通信に失敗しました','err'); }
  } else {
    var next = (act==='arriving') ? 'arriving' : 'done';
    if (next==='done' && !confirm('運行を完了します。よろしいですか？')) return;
    try{
      await fetch(SB+'orders?id=eq.'+id,{method:'PATCH',headers:H,
        body:JSON.stringify({status:next, updated_at:new Date().toISOString()})});
      toast(next==='done'?'完了しました。お疲れさまです':'運行を開始しました','ok');
    }catch(e){ toast('更新できませんでした','err'); }
  }
  load();
}

async function load(){
  try{
    var r=await fetch(SB+'orders?status=eq.open&order=created_at.desc',{headers:H});
    var d=await r.json();
    openOrders=Array.isArray(d)?d:[];

    var ids=openOrders.map(function(o){return o.id;});
    if (knownIds!==null){
      var fresh=ids.filter(function(x){ return knownIds.indexOf(x)===-1; });
      if (fresh.length) alertNew(fresh.length);
    }
    knownIds=ids;
    if (!openOrders.length) document.title='案件掲示板｜代行なう';

    var r2=await fetch(SB+'orders?company_id=eq.'+COMPANY_ID+'&status=in.(accepted,arriving)&order=accepted_at.desc',{headers:H});
    var d2=await r2.json();
    myOrders=Array.isArray(d2)?d2:[];

    $('metaText').textContent='募集中 '+openOrders.length+'件／対応中 '+myOrders.length+'件';
    render();
  }catch(e){ $('metaText').textContent='読み込みに失敗しました'; }
}

async function loadCompany(){
  try{
    var r=await fetch(SB+'companies?id=eq.'+COMPANY_ID+'&select=*',{headers:H});
    var d=await r.json();
    if (!r.ok) throw new Error((d && (d.message||d.hint)) || ('HTTP '+r.status));
    if (!d || !d[0]) throw new Error('会社データが見つかりません');
    if (d[0].name) $('coName').textContent=d[0].name;
    isOpen=!!d[0].is_open; paintToggle();
    if (d[0].appeal_until){ appealUntil=new Date(d[0].appeal_until).getTime(); paintAppeal(); }
    if (isOpen && !gpsStarted) startGPS();
  }catch(e){ toast('受付状態を読めません（'+(e && e.message ? e.message : '通信エラー')+'）','err'); }
}
function paintToggle(){
  var b=$('toggle');
  b.className='toggle '+(isOpen?'on':'off');
  b.textContent=isOpen?'受付中':'受付停止中';
  $('dot').style.background=isOpen?'var(--green)':'var(--muted)';
}
$('toggle').onclick=async function(){
  isOpen=!isOpen; paintToggle(); render();
  if (isOpen) startGPS();
  try{
    var pr=await fetch(SB+'companies?id=eq.'+COMPANY_ID,{method:'PATCH',headers:H,
      body:JSON.stringify({is_open:isOpen, free_cars:isOpen?1:0, status_updated_at:new Date().toISOString()})});
    if (!pr.ok){ var pd=await pr.json(); throw new Error((pd && (pd.message||pd.hint)) || ('HTTP '+pr.status)); }
    toast(isOpen?'受付を開始しました':'受付を停止しました','ok');
  }catch(e){
    isOpen=!isOpen; paintToggle(); render();
    toast('保存できませんでした（'+(e && e.message ? e.message : '通信エラー')+'）','err');
  }
};

/* ===== 空車アピール ===== */
var appealUntil=null;
function paintAppeal(){
  var el=$('appealLeft');
  if (!appealUntil){ el.textContent=''; return; }
  var m=Math.ceil((appealUntil-Date.now())/60000);
  el.textContent = m>0 ? '表示中 あと'+m+'分' : '';
  if (m<=0) appealUntil=null;
}
$('appeal').onclick=async function(){
  var cars=Number($('cars').value);
  var until=new Date(Date.now()+15*60000);
  appealUntil=until.getTime();
  paintAppeal();
  if (!isOpen){ isOpen=true; paintToggle(); startGPS(); }
  try{
    await fetch(SB+'companies?id=eq.'+COMPANY_ID,{method:'PATCH',headers:H,
      body:JSON.stringify({is_open:true, free_cars:cars,
        appeal_until:until.toISOString(), status_updated_at:new Date().toISOString()})});
    toast('15分間「すぐ来る順」の先頭に表示されます','ok');
  }catch(e){ toast('アピールを送信できませんでした','err'); }
};
$('newsBtn').onclick=async function(){
  var t=$('newsT').value.trim();
  if (!t){ toast('見出しを入力してください','err'); return; }
  try{
    await fetch(SB+'companies?id=eq.'+COMPANY_ID,{method:'PATCH',headers:H,
      body:JSON.stringify({news_title:t, news_at:new Date().toISOString()})});
    $('newsT').value='';
    toast('お知らせを掲載しました','ok');
  }catch(e){ toast('掲載できませんでした','err'); }
};
setInterval(paintAppeal, 20000);

function tryPin(){
  if (document.getElementById("pin").value.trim() === PIN){
    sessionStorage.setItem("bd_ok","1");
    document.getElementById("gate").style.display="none";
  } else {
    document.getElementById("gerr").textContent="番号が違います";
    document.getElementById("pin").value="";
  }
}
document.getElementById("gbtn").onclick = tryPin;
document.getElementById("pin").addEventListener("keydown", function(e){
  if (e.key === "Enter"){ e.preventDefault(); tryPin(); }
});
if (sessionStorage.getItem("bd_ok") !== "1"){
  document.getElementById("gate").style.display="flex";
  document.getElementById("pin").focus();
}

loadCompany();
setInterval(loadCompany, 30000);
load();
setInterval(load, 5000);
setInterval(render, 30000);
</script>
