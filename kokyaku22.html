<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>顧客一覧</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="/manifest-board.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="代行なう顧客">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --bg:#0B1220; --surface:#101B2E; --surface-2:#16233A; --line:#22314C;
  --text:#EAF1FF; --muted:#8A9BB8; --dim:#61748F;
  --amber:#FFB020; --green:#4ADE80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-feature-settings:"palt";-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* 暗証番号 */
#gate{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;
  align-items:center;justify-content:center;padding:26px}
#gate .in{width:100%;max-width:320px;text-align:center}
#gate h1{font-size:18px;font-weight:900;margin:0 0 6px}
#gate p{font-size:12.5px;color:var(--muted);margin:0 0 20px;font-weight:600}
#pin{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;
  color:var(--text);font-size:22px;font-weight:800;letter-spacing:.5em;text-align:center;
  padding:16px;margin-bottom:11px}
#pin:focus{outline:none;border-color:var(--amber)}
#gate button{width:100%;background:var(--amber);color:#241400;border:none;border-radius:13px;
  font-size:16px;font-weight:900;padding:16px}
#gerr{color:#FF6B6B;font-size:12.5px;font-weight:700;margin-top:12px;min-height:18px}

.bar{position:sticky;top:0;z-index:50;background:rgba(11,18,32,.96);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px 16px}
.bar .row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar h1{font-size:17px;font-weight:900;margin:0}
.bar .sub{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.bar a.back{font-size:12.5px;font-weight:800;color:var(--amber);text-decoration:none;
  border:1px solid var(--line);border-radius:999px;padding:8px 13px;white-space:nowrap}

.tools{padding:12px 16px 0}
#q{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  color:var(--text);font-size:15px;font-weight:600;padding:13px 14px;margin-bottom:9px}
#q:focus{outline:none;border-color:var(--amber)}
.sorts{display:flex;gap:7px}
.sorts button{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  color:var(--muted);font-size:12.5px;font-weight:800;padding:11px 4px}
.sorts button.on{background:rgba(255,176,32,.14);border-color:var(--amber);color:var(--amber)}

.stat{padding:11px 16px 0;font-size:11.5px;color:var(--dim);font-weight:700}
.dl{display:flex;gap:7px;padding:11px 16px 0}
.dl button{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  color:var(--muted);font-size:12.5px;font-weight:800;padding:11px 4px}

.wrap{padding:12px 16px 30px}
.c{background:var(--surface);border:1px solid var(--line);border-radius:15px;
  padding:14px 15px;margin-bottom:10px}
.c .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.c .nm{font-size:16px;font-weight:900;line-height:1.35}
.c .ph{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:3px}
.tag{font-size:10px;font-weight:900;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tag.rep{background:rgba(255,176,32,.16);color:var(--amber);border:1px solid rgba(255,176,32,.4)}
.tag.new{background:rgba(74,222,128,.14);color:var(--green);border:1px solid rgba(74,222,128,.35)}
.nums{display:flex;margin:12px 0 0;border-top:1px solid var(--line);padding-top:11px}
.nums div{flex:1;text-align:center}
.nums b{display:block;font-size:9.5px;font-weight:800;color:var(--dim);letter-spacing:.1em;margin-bottom:4px}
.nums .v{font-size:15.5px;font-weight:800}
.route{font-size:12px;color:var(--muted);font-weight:700;line-height:1.65;margin-top:11px}
.route span{color:var(--amber);font-weight:900}
.acts{display:flex;gap:8px;margin-top:12px}
.acts a,.acts button{flex:1;text-align:center;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;color:var(--text);font-size:13px;font-weight:800;padding:12px 4px;
  text-decoration:none;display:block}
.acts a.tel{color:var(--green)}
.hist{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:none}
.hist.open{display:block}
.h{font-size:12px;color:var(--muted);font-weight:700;line-height:1.6;padding:7px 0;
  border-bottom:1px solid rgba(34,49,76,.5)}
.h:last-child{border-bottom:none}
.h .d{color:var(--dim);font-size:11px}
.empty{text-align:center;color:var(--dim);font-size:13.5px;font-weight:700;padding:50px 20px;line-height:1.8}
</style>
</head>
<body>

<div id="gate">
  <div class="in">
    <h1>顧客一覧</h1>
    <p>暗証番号を入力してください</p>
    <input id="pin" type="tel" inputmode="numeric" maxlength="8" placeholder="････">
    <button id="gbtn">開く</button>
    <div id="gerr"></div>
  </div>
</div>

<div class="bar">
  <div class="row1">
    <div>
      <h1>顧客一覧</h1>
      <div class="sub" id="sub">読み込み中…</div>
    </div>
    <a class="back" href="/board6.html">案件板 →</a>
  </div>
</div>

<div class="tools">
  <input id="q" type="search" placeholder="名前・電話番号で探す">
  <div class="sorts">
    <button data-s="last" class="on">最近</button>
    <button data-s="count">回数</button>
    <button data-s="sum">売上</button>
  </div>
</div>
<div class="stat" id="stat"></div>
<div class="dl">
  <button id="dlC">顧客一覧を保存</button>
  <button id="dlO">全依頼を保存</button>
</div>
<div class="wrap" id="list"></div>

<script>
var PIN = "3179";  /* ← 暗証番号。変えたいときはこの数字を書き換えてください */

var SB = "https://kjfmcpwstubgezebmstt.supabase.co/rest/v1/";
var SK = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZm1jcHdzdHViZ2V6ZWJtc3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODU3MTksImV4cCI6MjA5NDE2MTcxOX0.GF5QPVI4AUCfIqdmApplwOAEDBoESZTfadi-hbOb7Gs";
var H = {"apikey":SK,"Authorization":"Bearer "+SK};

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function yen(n){ return Number(n||0).toLocaleString('ja-JP'); }
function digits(s){ return String(s==null?'':s).replace(/[^0-9]/g,''); }
function ymd(t){
  var d=new Date(t); if(isNaN(d)) return '';
  return (d.getMonth()+1)+'/'+d.getDate();
}
function ymdFull(t){
  var d=new Date(t); if(isNaN(d)) return '';
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+
    ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
function daysAgo(t){
  var d=new Date(t); if(isNaN(d)) return null;
  return Math.floor((Date.now()-d.getTime())/86400000);
}

/* ---- 暗証番号 ---- */
function openGate(){
  if (sessionStorage.getItem('kk_ok')==='1'){ $('gate').style.display='none'; load(); return; }
  $('gate').style.display='flex';
  $('pin').focus();
}
function tryPin(){
  if ($('pin').value.trim() === PIN){
    sessionStorage.setItem('kk_ok','1');
    $('gate').style.display='none';
    load();
  } else {
    $('gerr').textContent='番号が違います';
    $('pin').value='';
  }
}
$('gbtn').onclick = tryPin;
$('pin').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); tryPin(); } });

/* ---- 読み込み・集計 ---- */
var people = [];
var sortKey = 'last';

async function load(){
  try{
    var r = await fetch(SB+'orders?select=cname,cphone,pickup,dropoff,price,km,status,created_at&order=created_at.desc&limit=2000',{headers:H});
    var d = await r.json();
    if (!r.ok) throw new Error((d && (d.message||d.hint)) || ('HTTP '+r.status));
    rawRows = d || [];
    people = group(d||[]);
    $('sub').textContent = people.length + '人 / 依頼' + (d||[]).length + '件';
    render();
  }catch(e){
    $('sub').textContent = '読み込み失敗';
    $('list').innerHTML = '<div class="empty">読み込めませんでした<br>'+esc(e.message||'')+'</div>';
  }
}

function group(rows){
  var map = {};
  rows.forEach(function(o){
    var key = digits(o.cphone);
    if (!key) return;
    if (!map[key]) map[key] = { phone:key, raw:o.cphone, name:o.cname||'', count:0, sum:0, last:null, first:null, orders:[], routes:{} };
    var p = map[key];
    p.count++;
    p.sum += Number(o.price||0);
    if (o.cname && !p.name) p.name = o.cname;
    var t = o.created_at;
    if (t){
      if (!p.last || new Date(t) > new Date(p.last)) p.last = t;
      if (!p.first || new Date(t) < new Date(p.first)) p.first = t;
    }
    var rt = (o.pickup||'') + ' → ' + (o.dropoff||'');
    p.routes[rt] = (p.routes[rt]||0) + 1;
    p.orders.push(o);
  });
  return Object.keys(map).map(function(k){
    var p = map[k];
    var best = '', bn = 0;
    Object.keys(p.routes).forEach(function(rt){ if (p.routes[rt] > bn){ bn = p.routes[rt]; best = rt; } });
    p.topRoute = best;
    return p;
  });
}

function render(){
  var q = digits($('q').value) || $('q').value.trim();
  var list = people.filter(function(p){
    if (!q) return true;
    return p.phone.indexOf(digits(q)) >= 0 || (p.name && p.name.indexOf(q) >= 0);
  });
  list.sort(function(a,b){
    if (sortKey === 'count') return b.count - a.count;
    if (sortKey === 'sum') return b.sum - a.sum;
    return new Date(b.last||0) - new Date(a.last||0);
  });

  var reps = people.filter(function(p){ return p.count >= 2; }).length;
  var total = people.reduce(function(s,p){ return s + p.sum; }, 0);
  $('stat').textContent = 'リピーター ' + reps + '人 ／ 累計 ' + yen(total) + '円';

  if (!list.length){
    $('list').innerHTML = '<div class="empty">' + (q ? '見つかりませんでした' : 'まだ依頼がありません') + '</div>';
    return;
  }

  var o = '';
  list.forEach(function(p, i){
    var ago = daysAgo(p.last);
    o += '<div class="c">';
    o +=   '<div class="top"><div>';
    o +=     '<div class="nm">' + esc(p.name || '名前なし') + '</div>';
    o +=     '<div class="ph">' + esc(p.raw || p.phone) + '</div>';
    o +=   '</div>';
    o +=   (p.count >= 2 ? '<div class="tag rep">リピーター ' + p.count + '回</div>'
                         : '<div class="tag new">初回</div>');
    o +=   '</div>';
    o +=   '<div class="nums">';
    o +=     '<div><b>利用</b><div class="v">' + p.count + '<span style="font-size:11px;color:var(--muted)">回</span></div></div>';
    o +=     '<div><b>累計</b><div class="v">' + yen(p.sum) + '<span style="font-size:11px;color:var(--muted)">円</span></div></div>';
    o +=     '<div><b>最終</b><div class="v">' + (ago === null ? '-' : (ago === 0 ? '今日' : ago + '<span style="font-size:11px;color:var(--muted)">日前</span>')) + '</div></div>';
    o +=   '</div>';
    if (p.topRoute) o += '<div class="route"><span>よく使う経路</span><br>' + esc(p.topRoute) + '</div>';
    o +=   '<div class="acts">';
    o +=     '<a class="tel" href="tel:' + esc(p.phone) + '">電話する</a>';
    o +=     '<button onclick="tg(' + i + ')">履歴 ' + p.count + '件</button>';
    o +=   '</div>';
    o +=   '<div class="hist" id="h' + i + '">';
    p.orders.slice(0, 30).forEach(function(x){
      o += '<div class="h"><div class="d">' + esc(ymdFull(x.created_at)) + ' ・ ' + yen(x.price) + '円' +
           (x.km ? ' ・ ' + x.km + 'km' : '') + '</div>' +
           esc((x.pickup||'') + ' → ' + (x.dropoff||'')) + '</div>';
    });
    o +=   '</div>';
    o += '</div>';
  });
  $('list').innerHTML = o;
}

function tg(i){ var e = $('h'+i); if (e) e.classList.toggle('open'); }

/* ---- CSVで保存 ---- */
var rawRows = [];
function csvCell(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; }
function saveCsv(name, head, rows){
  var body = [head].concat(rows).map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
  var blob = new Blob([new Uint8Array([0xEF,0xBB,0xBF]), body], {type:'text/csv;charset=utf-8'});
  var d = new Date(), stamp = d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2);
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '_' + stamp + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
$('dlC').onclick = function(){
  if (!people.length){ alert('データがありません'); return; }
  saveCsv('顧客一覧', ['名前','電話番号','利用回数','累計金額','初回利用','最終利用','よく使う経路'],
    people.slice().sort(function(a,b){ return new Date(b.last||0)-new Date(a.last||0); })
      .map(function(p){ return [p.name, p.raw||p.phone, p.count, p.sum, ymdFull(p.first), ymdFull(p.last), p.topRoute]; }));
};
$('dlO').onclick = function(){
  if (!rawRows.length){ alert('データがありません'); return; }
  saveCsv('依頼履歴', ['日時','名前','電話番号','出発','到着','距離km','金額','状態'],
    rawRows.map(function(o){ return [ymdFull(o.created_at), o.cname, o.cphone, o.pickup, o.dropoff, o.km, o.price, o.status]; }));
};

$('q').addEventListener('input', render);
Array.prototype.forEach.call(document.querySelectorAll('.sorts button'), function(b){
  b.onclick = function(){
    Array.prototype.forEach.call(document.querySelectorAll('.sorts button'), function(x){ x.classList.remove('on'); });
    this.classList.add('on');
    sortKey = this.getAttribute('data-s');
    render();
  };
});

openGate();
</script>
</body>
</html>
