{screen==="order"&&<div style={{padding:16}}><div style={{fontSize:18,fontWeight:900,marginBottom:4}}>🚗 代行を呼ぶ</div><div style={{fontSize:12,color:C.t2,marginBottom:20}}>ワンタップで最短マッチング</div><div style={{marginBottom:20}}><CallButton driver={BEST_DRIVER} onPress={()=>setMatching({driver:BEST_DRIVER})} waitCount={ONLINE_COUNT}/></div><div style={{fontSize:13,fontWeight:700,color:C.t2,marginBottom:12}}>他のドライバー</div>{DRIVERS.filter(d=>d.id!==BEST_DRIVER.id).map(d=>(<div key={d.id} onClick={()=>d.active&&setMatching({driver:d})} style={{background:C.card,borderRadius:14,padding:"12px 14px",marginBottom:8,border:`1px solid ${C.b2}`,display:"flex",alignItems:"center",gap:12,cursor:d.active?"pointer":"default",opacity:d.active?1:.55}}><Av name={d.name} size={44} status={d.active}/><div style={{flex:1}}><div style={{fontWeight:700,fontSize:14,marginBottom:3}}>{d.name}</div><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{d.tags.map(t=><Tag key={t} label={t}/>)}</div></div><div style={{textAlign:"right"}}><div style={{fontSize:20,fontWeight:900,color:d.active?C.accent:C.t3}}>{d.active?`${d.eta}分`:"対応中"}</div><div style={{fontSize:11,color:C.t2}}>{fmtYen(d.price)}〜</div></div></div>))}<div style={{marginTop:20,background:C.card,borderRadius:16,padding:16,border:`1px solid ${C.b2}`}}><div style={{fontSize:13,fontWeight:700,color:C.t2,marginBottom:12}}>あなたの依頼履歴</div>{myPosts.length===0?<div style={{textAlign:"center",color:C.t3,padding:"20px 0",fontSize:13}}>まだ投稿がありません</div>:myPosts.slice(0,3).map(p=>(<div key={p.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:`1px solid ${C.border}`}}><div style={{flex:1,fontSize:13}}>{p.from} → {p.to}</div><span style={{fontSize:11,color:p.status==="募集中"?C.green:C.t3,fontWeight:700}}>{p.status}</span>{p.status==="受付終了"&&<button onClick={()=>setChat(p)} style={{fontSize:11,padding:"4px 10px",background:C.bL,color:C.blue,border:"none",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>チャット</button>}</div>))}</div></div>}
<div style={{display:screen==="map"?"block":"none",padding:16}}><div style={{fontSize:18,fontWeight:900,marginBottom:4}}>🗺️ マップ</div><div style={{fontSize:12,color:C.t2,marginBottom:12}}>オレンジ = ドライバー（6秒ごと更新）</div>{focusPost&&<div style={{background:C.aL,border:`1px solid ${C.accent}22`,borderRadius:10,padding:"8px 12px",marginBottom:10,display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:13}}>📍</span><div style={{flex:1,fontSize:13,color:C.accent,fontWeight:600}}>{focusPost.from} → {focusPost.to}</div><button onClick={()=>setFocusPost(null)} style={{background:"none",border:"none",color:C.t3,fontSize:16,cursor:"pointer"}}>×</button></div>}<MapView fromPos={fromPos} toPos={toPos} focusPost={focusPost} visible={screen==="map"}/><div style={{marginTop:14,background:C.card,borderRadius:16,padding:16,border:`1px solid ${C.b2}`}}><div style={{color:C.accent,fontWeight:800,fontSize:14,marginBottom:12}}>📏 距離・料金計算</div><div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}><div style={{width:9,height:9,borderRadius:"50%",background:C.green,flexShrink:0}}/><input value={fromInput} onChange={e=>{setFromInput(e.target.value);setFromPos(null);setDistance(null);}} placeholder="出発地（例：博多駅）" style={{...SI,flex:1}}/></div><div style={{paddingLeft:4,marginBottom:8}}><div style={{width:1.5,height:14,background:C.b3,marginLeft:4}}/></div><div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}><div style={{width:9,height:9,borderRadius:2,background:C.red,flexShrink:0}}/><input value={toInput} onChange={e=>{setToInput(e.target.value);setToPos(null);setDistance(null);}} placeholder="目的地（例：天神）" style={{...SI,flex:1}}/></div><div style={{display:"flex",gap:8}}><button onClick={doCalc} style={{flex:1,padding:"12px 0",background:"linear-gradient(135deg,#FF6B00,#FF3D00)",color:"#000",border:"none",borderRadius:12,fontWeight:800,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>📏 計算</button><button onClick={()=>{if(!fromInput||!toInput)return;window.open(`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(fromInput)}&destination=${encodeURIComponent(toInput)}&travelmode=driving`,"_blank");}} style={{flex:1,padding:"12px 0",background:"#0d2a0d",color:C.green,border:`1px solid ${C.green}22`,borderRadius:12,fontWeight:800,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>🗺️ Gマップ</button></div>{calcMsg&&<div style={{marginTop:10,fontSize:12,textAlign:"center",color:calcMsg.startsWith("✅")?C.green:calcMsg.startsWith("❌")||calcMsg.startsWith("⚠️")?C.red:C.accent}}>{calcMsg}</div>}{distance!==null&&(<div style={{marginTop:12,background:C.bg,borderRadius:14,padding:14,border:`1px solid ${C.accent}22`,textAlign:"center"}}><div style={{color:C.t2,fontSize:11,marginBottom:4}}>直線距離</div><div style={{color:C.accent,fontSize:30,fontWeight:900,lineHeight:1}}>{distance>=1?`${distance.toFixed(1)} km`:`${(distance*1000).toFixed(0)} m`}</div>{distance>=1&&<><div style={{color:C.t2,fontSize:11,marginTop:4}}>車で約{Math.round(distance/40*60)}分（40km/h想定）</div>{(()=>{const r=calcFare(distance);return r?(<><div style={{color:C.accent,fontSize:24,fontWeight:900,marginTop:6}}>{fmtYen(r.fare)}</div><div style={{color:C.t2,fontSize:11,marginTop:2}}>{fmtYen(r.min)} 〜 {fmtYen(r.max)}{r.isLate&&<span style={{color:"#AA00FF",marginLeft:4}}>🌙深夜割増+30%</span>}</div></>):null;})()}</>}</div>)}</div>}</div>}
{screen==="ranking"&&<RankingScreen me={ME}/>}
{screen==="battle"&&<BattleScreen me={ME} showToast={showToast} quickSide={battleQuickSide} onClearQuickSide={()=>setBattleQuickSide(null)} onScrollTop={()=>{if(scrollRef.current)scrollRef.current.scrollTop=0;}}/>}
</div>
<div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"rgba(8,8,8,.97)",borderTop:`1px solid ${C.border}`,display:"flex",backdropFilter:"blur(16px)",zIndex:100}}>{NAV.map(n=>(<button key={n.id} onClick={()=>setScreen(n.id)} style={{flex:1,padding:"10px 0 14px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,fontFamily:"inherit",color:screen===n.id?C.accent:C.t3,transition:"color .15s"}}><span style={{fontSize:18,lineHeight:1}}>{n.icon}</span><span style={{fontSize:9,fontWeight:screen===n.id?700:400,letterSpacing:.3}}>{n.label}</span>{screen===n.id&&<div style={{width:18,height:2,borderRadius:1,background:C.accent,marginTop:1}}/>}</button>))}</div>
</div>);}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
