<script>
var SB="https://kjfmcpwstubgezebmstt.supabase.co/rest/v1/";
var SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZm1jcHdzdHViZ2V6ZWJtc3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODU3MTksImV4cCI6MjA5NDE2MTcxOX0.GF5QPVI4AUCfIqdmApplwOAEDBoESZTfadi-hbOb7Gs";
var H={"apikey":SK,"Authorization":"Bearer "+SK};
var CO="daikounaw";

/* 配車ページは daikounaw.com に一本化 */
var YOBU="https://daikounaw.com/yobu";

/* ===== 案件ボード（募集中の依頼） ===== */
function jbEsc(v){ return String(v==null?'':v).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ===== 登録代行業者の一覧 ===== */
function yen2(v){ return Number(v||0).toLocaleString('ja-JP'); }

var clTab='osusume';
var clAll=[];

function isSoon(c){
  if(!c.is_open) return false;
  if(!c.appeal_until) return false;
  return new Date(c.appeal_until).getTime() > Date.now();
}

function clPaint(list, ok){
  var e=document.getElementById('cl'); if(!e) return;
  if(!ok){ e.innerHTML='<div class="cnone">読み込み中…</div>'; return; }

  var v = list.slice();
  if(clTab==='soon'){
    v = v.filter(isSoon);
    if(!v.length){
      e.innerHTML='<div class="cnone">いま「すぐ行けます」と出している<br>運転代行はありません。<br>おすすめ順からご依頼ください。</div>';
      return;
    }
  }
  if(!v.length){ e.innerHTML='<div class="cnone">登録業者はまだありません。</div>'; return; }

  var o='';
  v.forEach(function(c){
    o+='<div class="cc'+(c.featured?' feat':'')+'">';
    o+='<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:9px">';
    o+='<div style="min-width:0">';
    if(c.featured) o+='<div class="cf">\uD83C\uDFC5 認定</div>';
    o+='<div class="cnm">'+jbEsc(c.name)+'</div>';
    var ar=[c.pref,c.area].filter(Boolean).join(' · ');
    if(ar) o+='<div class="car">\uD83D\uDCCD '+jbEsc(ar)+'</div>';
    o+='</div>';
    o+='<div class="cst '+(c.is_open?'on':'off')+'">'+(isSoon(c)?'すぐ行けます':(c.is_open?'受付中':'受付停止'))+'</div>';
    o+='</div>';
    if(c.hours) o+='<div class="chr">\uD83D\uDD52 '+jbEsc(c.hours)+'</div>';
    if(c.phone) o+='<div class="ctel">'+jbEsc(c.phone)+'</div>';
    if(c.base_fare>0 || c.per_km>0){
      o+='<div class="cfr">';
      if(c.base_fare>0) o+='<span>初乗り <b>'+yen2(c.base_fare)+'円</b></span>';
      if(c.per_km>0)    o+='<span>追加 <b>1km '+yen2(c.per_km)+'円</b></span>';
      o+='</div>';
    }
    if(c.campaign) o+='<div class="ccp">\uD83C\uDF89 '+jbEsc(c.campaign)+'</div>';
    o+='<div class="cb">';
    if(c.phone) o+='<a class="call" href="tel:'+jbEsc(String(c.phone).replace(/[^0-9+]/g,''))+'">電話をかける</a>';
    o+='<a class="go" data-co="'+jbEsc(c.id)+'" href="'+YOBU+'?co='+encodeURIComponent(c.id)+
      (pinLat?('&lat='+pinLat+'&lng='+pinLng):'')+'">この場所に呼ぶ</a>';
    o+='</div></div>';
  });
  e.innerHTML=o;
  paintGo();
}

async function clLoad(){
  try{
    var r=await fetch(SB+'companies?select=*&order=featured.desc,is_open.desc,name.asc&limit=30',{headers:H});
    var d=await r.json();
    clAll = Array.isArray(d)?d:[];
    clPaint(clAll, true);
  }catch(e){ clPaint([], true); }
}
document.getElementById('tb1').onclick=function(){
  clTab='osusume';
  document.getElementById('tb1').classList.add('on');
  document.getElementById('tb2').classList.remove('on');
  clPaint(clAll, true);
};
document.getElementById('tb2').onclick=function(){
  clTab='soon';
  document.getElementById('tb2').classList.add('on');
  document.getElementById('tb1').classList.remove('on');
  clPaint(clAll, true);
};
clPaint([], false);
clLoad();
setInterval(clLoad, 60000);

function jbPaint(o, ok){
  var e=document.getElementById('jb'); if(!e) return;
  var h='<div class="jh"><div class="jt">\uD83D\uDCCB 業者専用・案件掲示板</div>'+
        '<div class="jc">'+(ok?('募集中 '+o.pending+'件／対応中 '+o.active+'件'):'読み込み中…')+'</div></div>';
  h+='<div class="jn">お客様からの依頼を受注する画面です。<br>暗証番号が必要です。</div>';
  h+='<a class="jgo" href="board6.html">案件掲示板を開く</a>';
  e.innerHTML=h;
}

async function jbLoad(){
  try{
    var a=await fetch(SB+'orders?select=id,status&status=in.(pending,accepted,arriving)',{headers:H});
    var d=await a.json();
    d=Array.isArray(d)?d:[];
    jbPaint({pending:d.filter(function(x){return x.status==='pending'}).length,
             active: d.filter(function(x){return x.status!=='pending'}).length}, true);
  }catch(e){ jbPaint({pending:0,active:0}, true); }
}
jbPaint({pending:0,active:0}, false);
jbLoad();
setInterval(jbLoad, 60000);
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function yen(n){return Number(n).toLocaleString('ja-JP');}

var map=L.map('map',{zoomControl:false,attributionControl:false}).setView([33.5902,130.4017],16);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:20}).addTo(map);
L.control.attribution({prefix:false}).addAttribution('&copy; OpenStreetMap, CARTO').addTo(map);

navigator.geolocation && navigator.geolocation.getCurrentPosition(function(p){
  map.setView([p.coords.latitude,p.coords.longitude],17);
}, function(){}, {enableHighAccuracy:true,timeout:8000});

/* 中心の地名をピンに表示 */
var geoT=null;
var pinLat=null, pinLng=null;
function paintGo(){
  var c=map.getCenter();
  pinLat=c.lat.toFixed(6); pinLng=c.lng.toFixed(6);
  /* 一覧の「この場所に呼ぶ」に現在のピン位置を渡す */
  Array.prototype.forEach.call(document.querySelectorAll('a.go[data-co]'), function(a){
    a.href=YOBU+'?co='+encodeURIComponent(a.getAttribute('data-co'))+'&lat='+pinLat+'&lng='+pinLng;
  });
}
async function reverse(){
  var c=map.getCenter();
  try{
    var r=await fetch('https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&accept-language=ja&lat='+c.lat+'&lon='+c.lng);
    var d=await r.json();
    if (d && d.address){
      var a=d.address;
      var s=[a.suburb||a.neighbourhood||a.city_district||'', a.road||'', a.amenity||''].filter(Boolean).join(' ').trim();
      if (!s) s=(a.city||a.town||a.village||'');
      if (s) $('lbl').innerHTML='<b>お迎え</b>　'+esc(s);
    }
  }catch(e){}
}
window.addEventListener('resize', function(){ setTimeout(function(){ map.invalidateSize(); },150); });
map.on('move', function(){ paintGo(); });
map.on('moveend', function(){ clearTimeout(geoT); geoT=setTimeout(reverse, 500); });

function liveMin(c){
  if (!c.appeal_until) return 0;
  var m=Math.ceil((new Date(c.appeal_until).getTime()-Date.now())/60000);
  return m>0?m:0;
}
var mark=null;
async function load(){
  try{
    var r=await fetch(SB+'companies?id=eq.'+CO+'&select=*',{headers:H});
    var d=await r.json(); if(!d||!d[0]) return;
    var c=d[0], lm=liveMin(c), free=c.free_cars||0, live=(lm>0&&free>0);

    $('st').className='st'+(c.is_open?' on':'');
    $('stTxt').textContent = live ? '空車'+free+'台' : (c.is_open?'受付中':'受付停止中');


    if (c.lat && c.lng){
      var col=live?'#2ECC71':'#8FA3BF';
      var ic=L.divIcon({className:'',iconSize:[20,20],iconAnchor:[10,10],
        html:'<div style="width:20px;height:20px;border-radius:50%;background:'+col+
          ';border:3px solid #0B1220;box-shadow:0 0 0 '+(live?'6px':'3px')+' '+col+'33"></div>'});
      if (mark){ mark.setLatLng([c.lat,c.lng]); mark.setIcon(ic); }
      else mark=L.marker([c.lat,c.lng],{icon:ic}).addTo(map);
    }
  }catch(e){}
}

/* ===== アプリとして使う（PWA） ===== */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}

var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  showInstall('android');
});

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}
function showInstall(kind){
  if (isStandalone()) return;
  if (document.getElementById('inst')) return;
  var d = document.createElement('div');
  d.id = 'inst';
  d.className = 'inst';
  d.innerHTML = (kind === 'ios')
    ? '<div class="it">アプリとして使えます</div>' +
      '<div class="ib">下の <b>共有ボタン</b> を押して<br><b>「ホーム画面に追加」</b>を選んでください</div>' +
      '<button class="ix" id="instX">閉じる</button>'
    : '<div class="it">アプリとして使えます</div>' +
      '<div class="ib">ホーム画面に追加すると、次から一度で開けます</div>' +
      '<div class="ir"><button class="ib1" id="instGo">追加する</button>' +
      '<button class="ix" id="instX">あとで</button></div>';
  document.body.appendChild(d);
  setTimeout(function(){ d.classList.add('on'); }, 60);

  document.getElementById('instX').onclick = function(){
    d.classList.remove('on');
    setTimeout(function(){ d.remove(); }, 260);
    try{ sessionStorage.setItem('instHide','1'); }catch(e){}
  };
  var go = document.getElementById('instGo');
  if (go) go.onclick = async function(){
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    d.classList.remove('on');
    setTimeout(function(){ d.remove(); }, 260);
  };
}

setTimeout(function(){
  var hidden = false;
  try{ hidden = sessionStorage.getItem('instHide') === '1'; }catch(e){}
  if (!hidden && isIOS() && !isStandalone()) showInstall('ios');
}, 4000);

paintGo(); load(); setTimeout(reverse, 1400);
setInterval(load, 20000);
</script>
